<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>patch bay — soundboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#242320;
    --panel:#2d2c28;
    --pad:#35342f;
    --pad-hover:#3d3c36;
    --line:#4a4943;
    --amber:#d98f2b;
    --amber-dim:#6b4c1f;
    --red:#b4483c;
    --teal:#4f7f73;
    --ink:#e8e1d3;
    --ink-dim:#a8a196;
    --ink-faint:#6f6c63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
  }
  .wrap{
    max-width:860px;
    margin:0 auto;
    padding:32px 20px 60px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:2px solid var(--line);
    padding-bottom:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  h1{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:700;
    font-size:40px;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
    line-height:0.9;
  }
  .tag{
    color:var(--ink-faint);
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-top:4px;
  }
  .master{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .master span{
    font-size:11px;
    letter-spacing:1px;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  input[type=range]{
    -webkit-appearance:none;
    width:110px;
    height:3px;
    background:var(--line);
    border-radius:2px;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:var(--amber);
    cursor:pointer;
    border:2px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:var(--amber);
    cursor:pointer;
    border:2px solid var(--bg);
  }

  .addbar{
    display:flex;
    gap:8px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .addbar input{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:10px 12px;
    border-radius:2px;
    outline:none;
  }
  .addbar input::placeholder{ color:var(--ink-faint); }
  .addbar input:focus{ border-color:var(--amber); }
  #url-input{ flex:2; min-width:200px; }
  #name-input{ flex:1; min-width:140px; }
  .addbar button{
    background:var(--amber);
    border:none;
    color:#2a1c05;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:13px;
    letter-spacing:0.5px;
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .addbar button:hover{ background:#e8a04a; }
  .error{
    color:var(--red);
    font-size:12px;
    margin:-18px 0 20px;
    display:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:10px;
  }
  .pad{
    position:relative;
    background:var(--pad);
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 14px 12px;
    cursor:pointer;
    text-align:left;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    transition:background 0.1s;
  }
  .pad:hover{ background:var(--pad-hover); }
  .pad.playing{
    border-color:var(--amber);
    background:#3a2f1e;
  }
  .pad-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .jack-id{
    font-size:11px;
    color:var(--ink-faint);
    letter-spacing:1px;
  }
  .led{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber-dim);
    flex-shrink:0;
    margin-top:2px;
  }
  .pad.playing .led{
    background:var(--amber);
    box-shadow:0 0 6px var(--amber);
  }
  .pad-name{
    font-size:14px;
    font-weight:500;
    line-height:1.3;
    margin-bottom:2px;
    word-break:break-word;
  }
  .pad-state{
    font-size:10px;
    letter-spacing:1px;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  .pad.playing .pad-state{ color:var(--amber); }
  .del{
    position:absolute;
    top:8px; right:8px;
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:14px;
    cursor:pointer;
    line-height:1;
    padding:2px 4px;
  }
  .del:hover{ color:var(--red); }

  .empty{
    color:var(--ink-faint);
    font-size:13px;
    padding:30px 0;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:3px;
  }
  .hidden-players{
    position:absolute;
    width:0; height:0;
    overflow:hidden;
  }
  footer{
    margin-top:32px;
    color:var(--ink-faint);
    font-size:11px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>patch bay</h1>
      <div class="tag">soundboard de áudio — youtube</div>
    </div>
    <div class="master">
      <span>master</span>
      <input type="range" id="master-vol" min="0" max="100" value="80">
    </div>
  </header>

  <div class="addbar">
    <input id="url-input" type="text" placeholder="cole o link do youtube">
    <input id="name-input" type="text" placeholder="nome do som">
    <button id="add-btn">adicionar</button>
  </div>
  <div class="error" id="error-msg">link inválido — cole um link do youtube.</div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty-msg">nenhum som cadastrado ainda. cole um link do youtube acima pra começar.</div>

  <div class="hidden-players" id="players"></div>

  <footer>clique num pad pra tocar/pausar. vários sons podem tocar juntos.</footer>
</div>

<script>
  var sounds = [];
  var players = {};
  var ytReady = false;
  var pendingActions = [];

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    ytReady = true;
    pendingActions.forEach(function(fn){ fn(); });
    pendingActions = [];
  };

  function extractVideoId(url){
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function renderGrid(){
    var grid = document.getElementById('grid');
    var emptyMsg = document.getElementById('empty-msg');
    grid.innerHTML = '';
    emptyMsg.style.display = sounds.length ? 'none' : 'block';

    sounds.forEach(function(s, idx){
      var isPlaying = players[s.id] && players[s.id]._playing;
      var pad = document.createElement('button');
      pad.className = 'pad' + (isPlaying ? ' playing' : '');
      pad.innerHTML =
        '<div class="pad-top">' +
          '<span class="jack-id">CH ' + String(idx+1).padStart(2,'0') + '</span>' +
          '<span class="led"></span>' +
        '</div>' +
        '<div class="pad-name">' + escapeHtml(s.name) + '</div>' +
        '<div class="pad-state">' + (isPlaying ? 'tocando' : 'parado') + '</div>' +
        '<button class="del" aria-label="remover" data-id="' + s.id + '">×</button>';

      pad.addEventListener('click', function(e){
        if(e.target.classList.contains('del')) return;
        togglePad(s.id);
      });
      pad.querySelector('.del').addEventListener('click', function(e){
        e.stopPropagation();
        removeSound(s.id);
      });
      grid.appendChild(pad);
    });
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function togglePad(id){
    var run = function(){
      var existing = players[id];
      if(existing){
        if(existing._playing){
          existing.pauseVideo();
        } else {
          existing.setVolume(Number(document.getElementById('master-vol').value));
          existing.playVideo();
        }
        return;
      }
      createPlayer(id);
    };
    if(!ytReady){ pendingActions.push(run); return; }
    run();
  }

  function createPlayer(id){
    var sound = sounds.find(function(s){ return s.id === id; });
    if(!sound) return;
    var container = document.createElement('div');
    container.id = 'yt-' + id;
    document.getElementById('players').appendChild(container);

    var player = new YT.Player(container.id, {
      height: '0',
      width: '0',
      videoId: sound.videoId,
      playerVars: { autoplay: 1, controls: 0, disablekb: 1 },
      events: {
        onReady: function(e){
          e.target.setVolume(Number(document.getElementById('master-vol').value));
          e.target.playVideo();
        },
        onStateChange: function(e){
          player._playing = (e.data === YT.PlayerState.PLAYING);
          renderGrid();
        }
      }
    });
    players[id] = player;
  }

  function removeSound(id){
    if(players[id]){
      players[id].destroy();
      delete players[id];
    }
    sounds = sounds.filter(function(s){ return s.id !== id; });
    renderGrid();
  }

  document.getElementById('add-btn').addEventListener('click', function(){
    var urlInput = document.getElementById('url-input');
    var nameInput = document.getElementById('name-input');
    var errorMsg = document.getElementById('error-msg');
    var videoId = extractVideoId(urlInput.value.trim());

    if(!videoId){
      errorMsg.style.display = 'block';
      return;
    }
    errorMsg.style.display = 'none';

    var name = nameInput.value.trim() || 'som ' + (sounds.length + 1);
    sounds.push({ id: 'snd-' + Date.now() + '-' + Math.floor(Math.random()*1000), name: name, videoId: videoId });
    urlInput.value = '';
    nameInput.value = '';
    renderGrid();
  });

  document.getElementById('master-vol').addEventListener('input', function(){
    var v = Number(this.value);
    Object.keys(players).forEach(function(id){ players[id].setVolume(v); });
  });

  renderGrid();
</script>
</body>
</html>

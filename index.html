<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Suade - Menu</title>
    <!-- Importação das fontes do projeto base -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis exatas do seu código base */
        :root {
            --bg: #0b0d0c;
            --bg2: #141815;
            --bg3: #1b201c;
            --parchment: #e8dcc0;
            --parchment-dim: #d9cba3;
            --iron: #3a3f3d;
            --iron-light: #565c58;
            --blood: #6e1f1f;
            --blood-bright: #9c3230;
            --bronze: #a8823c;
            --bronze-bright: #c9a45e;
            --ink: #e6ded0;
            --ink-dim: #9b9488;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fundo idêntico ao da página de criação */
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1a1510 0%, var(--bg) 60%);
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'EB Garamond', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 4rem 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        /* Container que simula a tela do App */
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        /* Cabeçalho no estilo "Hero" */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .logo-vetor {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--parchment);
            letter-spacing: .03em;
            text-shadow: 0 2px 24px rgba(0,0,0,.6);
            margin-bottom: 4px;
        }

        .header p {
            color: var(--bronze-bright);
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        /* Linha divisória ornamental */
        .divider {
            height: 1px;
            width: 60%;
            margin: 0 auto;
            background: linear-gradient(90deg, transparent, var(--iron), transparent);
        }

        /* Menu de Links (Adaptado da classe .pick-card) */
        .links-menu {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .botao-link {
            position: relative;
            background: linear-gradient(160deg, var(--bg3), #171b17);
            border: 1px solid var(--iron);
            border-radius: 3px;
            padding: 1.2rem;
            cursor: pointer;
            transition: border-color .18s, transform .18s, background .18s;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            text-decoration: none;
        }

        .botao-link:hover {
            border-color: var(--iron-light);
            transform: translateY(-2px);
            background: linear-gradient(160deg, #221614, #171b17);
        }

        /* Destaque para o hover imitando a seleção da ficha */
        .botao-link:hover h2 {
            color: var(--parchment);
        }
        
        .botao-link:hover .icon {
            color: var(--blood-bright);
        }

        /* Ícones dentro dos botões */
        .icon {
            width: 32px;
            height: 32px;
            color: var(--bronze);
            transition: color .18s;
            flex-shrink: 0;
        }

        /* Textos do Botão */
        .texto-botao {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .botao-link h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--parchment-dim);
            letter-spacing: .02em;
            transition: color .18s;
        }

        .botao-link p {
            font-size: 0.88rem;
            color: var(--ink-dim);
            line-height: 1.3;
            font-style: italic;
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- CABEÇALHO -->
        <header class="header">
            <div class="logo-vetor">
                <!-- D20 com as cores da paleta (bronze) -->
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="var(--bronze)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            
            <div>
                <h1>RPG Suade</h1>
                <p>Savage Worlds Adventure Edition</p>
            </div>
            
            <div class="divider"></div>
        </header>

        <!-- MENU DE LINKS (Baseado nos cards de seleção) -->
        <nav class="links-menu">
            
            <!-- Link 1: Criação de Personagem -->
            <a href="criacao.html" class="botao-link">
                <!-- SVG Vetor -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <polyline points="17 11 19 13 23 9"></polyline>
                </svg>
                <div class="texto-botao">
                    <h2>Criação de Personagem</h2>
                    <p>Forje o seu herói antes da batalha.</p>
                </div>
            </a>

            <!-- Link 2: Table Top -->
            <a href="tabletop.html" class="botao-link">
                <!-- SVG Vetor -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
                    <line x1="9" y1="3" x2="9" y2="18"></line>
                    <line x1="15" y1="6" x2="15" y2="21"></line>
                </svg>
                <div class="texto-botao">
                    <h2>Mesa Virtual (Table Top)</h2>
                    <p>Acesse o grid e role os dados.</p>
                </div>
            </a>

        </nav>
    </div>

</body>
</html>
